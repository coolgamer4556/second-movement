name: Build Sensor Watch Pro Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM Embedded Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi python3

      - name: Compile Firmware
        run: |
          make BOARD=sensorwatch_pro DISPLAY=custom

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensorwatch-pro-firmware
          path: build/firmware.uf2
